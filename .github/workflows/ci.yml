# CI: build, test, evaluate a candidate, upload the machine-readable report.
#
# The evaluation runs in fixture mode (deterministic, labeled, zero cost).
# To evaluate against a live model provider, set repository secrets
# LLM_BASE_URL / LLM_API_KEY / LLM_MODEL and pass --mode live to run_eval.py.
#
# IMPORTANT: the POSTGRES_PASSWORD secret must be exactly `arl-test`, because
# platform/src/test/resources/application-test.properties hardcodes that
# password for the test datasource. Any other value breaks the platform tests.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: agentreleaselab_test
          POSTGRES_USER: arl
          POSTGRES_PASSWORD: arl-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arl"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test platform
        working-directory: platform
        run: mvn -B test

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-worker/requirements.txt
      - name: Test worker
        working-directory: agent-worker
        run: |
          pip install -r requirements.txt
          python -m pytest -q

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build

  release-decision:
    runs-on: ubuntu-latest
    needs: [platform, worker]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: agentreleaselab
          POSTGRES_USER: arl
          POSTGRES_PASSWORD: arl-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arl"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start platform
        working-directory: platform
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/agentreleaselab
          DB_USER: arl
          DB_PASSWORD: arl-test
        run: |
          mvn -B -q -DskipTests package
          java -jar target/*.jar > /tmp/platform.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/health && break || sleep 2
          done
      - name: Start worker
        working-directory: agent-worker
        env:
          PLATFORM_BASE_URL: http://localhost:8080
          REDIS_URL: redis://localhost:6379/0
        run: |
          pip install -r requirements.txt
          uvicorn app.main:app --host 127.0.0.1 --port 8001 > /tmp/worker.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8001/health && break || sleep 2
          done
      - name: Evaluate candidates (fixture mode)
        run: python3 benchmarks/run_eval.py --mode fixture --out benchmarks/reports
      - name: Upload machine-readable report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: benchmarks/reports/eval-report-*.json
