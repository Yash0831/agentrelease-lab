          Triaged ACME-101: the VPN troubleshooting runbook (v3) says to check
          service status first; vpn is DEGRADED (known issue), so I moved the
          ticket to IN_PROGRESS and noted no client reconfiguration is needed.
        citations: [{slug: "vpn-troubleshooting", version: 3}]
